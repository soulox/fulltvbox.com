title: "The Thicket"
kind: movie
genres: [western, thriller]
description: "A young man hires a bounty hunter played by Peter Dinklage to track the outlaw gang that kidnapped his sister, a trek that leads into a lawless stretch of Texas wilderness."
verdict: depends
take: "Familiar revenge-western plot carried by Dinklage and Juliette Lewis. Great for gritty-western fans, forgettable if you want surprises."
