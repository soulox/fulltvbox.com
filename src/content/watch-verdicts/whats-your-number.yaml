title: "What's Your Number?"
kind: movie
genres: [comedy, romance]
description: "Anna Faris plays a woman who sets out to revisit her exes after reading that people with many past partners rarely marry, with her neighbor, played by Chris Evans, as her wingman."
verdict: skip
take: "Faris and Evans are likable, but it's a predictable, boilerplate rom-com. Only worth it for a very low-stakes night."
